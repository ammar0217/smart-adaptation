<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية | مستشار التكيف الجامعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 border-b border-slate-800 py-4 shadow-md">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="bg-rose-600 text-white p-2 rounded-xl font-bold text-lg">🔒</span>
                <div>
                    <h1 class="font-bold text-lg text-rose-300">لوحة تحكم الأستاذ (خاصة)</h1>
                    <p class="text-xs text-slate-400">إدارة الإحصائيات، السجلات، وتتبع الزوار</p>
                </div>
            </div>
            <button onclick="logoutAdmin()" id="logout-btn" class="hidden text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">تسجيل خروج</button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-5xl flex-grow">
        
        <!-- شاشة التحقق -->
        <div id="auth-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl max-w-md mx-auto text-center">
            <span class="text-4xl">🔐</span>
            <h2 class="text-xl font-bold mt-3 mb-1 text-rose-300">منطقة مقيدة</h2>
            <p class="text-xs text-slate-400 mb-6">أدخل كلمة المرور الخاصة بلوحة التحكم.</p>
            <div class="mb-4 text-right">
                <label class="block text-xs font-semibold text-slate-300 mb-2">كلمة المرور:</label>
                <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-rose-500">
            </div>
            <button onclick="verifyPassword()" class="w-full bg-rose-600 hover:bg-rose-500 py-3 rounded-xl font-semibold transition text-sm">دخول اللوحة</button>
        </div>

        <!-- لوحة التحكم -->
        <div id="dashboard-box" class="hidden space-y-6">
            
            <!-- بطاقات الإحصائيات العامة -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-md flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400">إجمالي المشاركين (المكتملين)</p>
                        <h3 id="stat-total-users" class="text-2xl font-black text-blue-400 mt-1">0</h3>
                    </div>
                    <span class="text-2xl bg-blue-950 p-3 rounded-xl border border-blue-800">👥</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-md flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400">إجمالي الزيارات العامة للموقع</p>
                        <h3 id="stat-total-visits" class="text-2xl font-black text-emerald-400 mt-1">0</h3>
                    </div>
                    <span class="text-2xl bg-emerald-950 p-3 rounded-xl border border-emerald-800">👁️</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-md flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400">متوسط تقييم المنصة (النجوم)</p>
                        <h3 id="stat-avg-rating" class="text-2xl font-black text-amber-400 mt-1">0 ⭐</h3>
                    </div>
                    <span class="text-2xl bg-amber-950 p-3 rounded-xl border border-amber-800">⭐</span>
                </div>
            </div>

            <!-- تبديل العرض (سجلات المشاركين vs سجل الزوار) -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <div class="flex space-x-2 space-x-reverse">
                        <button onclick="switchTab('quiz')" id="tab-quiz" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-emerald-700 text-white">نتائج المشاركين والأقسام</button>
                        <button onclick="switchTab('visitors')" id="tab-visitors" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700">سجل الزيارات العامة (بدون تسجيل)</button>
                    </div>
                    <span id="total-badge" class="bg-slate-800 text-slate-300 border border-slate-700 text-xs px-3 py-1.5 rounded-xl font-bold">0 سجلات</span>
                </div>

                <!-- محتوى الجداول -->
                <div id="table-container" class="space-y-3 max-h-96 overflow-y-auto mb-6 pr-1"></div>

                <!-- أزرار الإجراءات -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <button onclick="exportToExcel()" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white py-3 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-2 space-x-reverse">
                        <span>📥 تحميل التقارير والسجلات كملف Excel</span>
                    </button>
                    <button onclick="clearAllRecords()" class="bg-rose-950/60 hover:bg-rose-900/60 border border-rose-800 text-rose-300 px-4 py-3 rounded-xl text-xs font-semibold transition">مسح كافة السجلات</button>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-400">
        نظام الحماية والتحكم الآمن | مشروع المهارات الحياتية
    </footer>

    <script>
        // رابط Google Apps Script (جدول النتائج المشترك) — كلمة المرور محفوظة في السكربت وليس هنا
        const API_URL = "https://script.google.com/macros/s/AKfycbyr56otkGtZ06tDcDH90G-2WNxeHgPZ_DEoc4gb3yY6E06MIhuZd2_2DETek_fOGkeogQ/exec";
        let currentTab = 'quiz';
        const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        let adminPass = "";
        let cachedData = { results: [], visits: [] };

        async function callApi(data) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(Object.assign({ pass: adminPass }, data))
            });
            return res.json();
        }

        async function refreshData() {
            const out = await callApi({ action: 'list' });
            if (!out.ok) throw new Error(out.error || 'error');
            cachedData = { results: out.results, visits: out.visits, extraHeaders: out.extraHeaders || [] };
            loadAdminData();
        }

        async function verifyPassword() {
            adminPass = document.getElementById('admin-pass').value;
            try {
                await refreshData();
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('dashboard-box').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
            } catch (e) {
                alert(e.message === 'wrong_password' ? "كلمة المرور غير صحيحة!" : "تعذّر الاتصال بجدول النتائج، حاول مرة ثانية.");
                document.getElementById('admin-pass').value = "";
            }
        }

        function logoutAdmin() {
            adminPass = "";
            cachedData = { results: [], visits: [] };
            document.getElementById('dashboard-box').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('auth-box').classList.remove('hidden');
            document.getElementById('admin-pass').value = "";
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'quiz') {
                document.getElementById('tab-quiz').className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-emerald-700 text-white";
                document.getElementById('tab-visitors').className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700";
            } else {
                document.getElementById('tab-visitors').className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-emerald-700 text-white";
                document.getElementById('tab-quiz').className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-slate-300 hover:bg-slate-700";
            }
            loadAdminData();
        }

        function loadAdminData() {
            let quizRecords = cachedData.results;
            let visitorsLog = cachedData.visits;

            document.getElementById('stat-total-users').innerText = quizRecords.length;
            document.getElementById('stat-total-visits').innerText = visitorsLog.length;

            let avgRating = 0;
            if (quizRecords.length > 0) {
                let sumRatings = quizRecords.reduce((acc, rec) => {
                    let rNum = parseInt(rec.rating) || 5;
                    return acc + rNum;
                }, 0);
                avgRating = (sumRatings / quizRecords.length).toFixed(1);
            }
            document.getElementById('stat-avg-rating').innerText = `${avgRating} ⭐`;

            let container = document.getElementById('table-container');

            if (currentTab === 'quiz') {
                document.getElementById('total-badge').innerText = `${quizRecords.length} مشاركين مكتملين`;
                if (quizRecords.length === 0) {
                    container.innerHTML = `<p class='text-sm text-slate-400 text-center py-8 bg-slate-950/50 rounded-xl border border-slate-800'>لا توجد أي نتائج مشاركين مسجلة حتى الآن.</p>`;
                    return;
                }

                let html = "";
                quizRecords.forEach((rec, idx) => {
                    html += `
                        <div class='bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2'>
                            <div>
                                <p class='font-bold text-sm text-blue-300'>#${idx + 1} - ${esc(rec.name)} <span class='text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded ml-2'>${esc(rec.profile)}</span></p>
                                <p class='text-xs text-slate-400 mt-1'>التقييم: ${esc(rec.level)}</p>
                                <p class='text-xs text-amber-400 mt-0.5'>تقييم المنصة: <strong>${esc(rec.rating || 'غير متوفر')}</strong></p>
                                <p class='text-[10px] text-slate-500 mt-0.5'>${esc(rec.date)}</p>
                            </div>
                            <div class='flex items-center space-x-3 space-x-reverse self-end sm:self-center'>
                                <span class='bg-emerald-950 border border-emerald-800 text-emerald-300 px-3 py-1 rounded-lg text-xs font-bold'>${esc(rec.score)}</span>
                                <button onclick="deleteSingleRecord(${idx}, 'quiz')" class='bg-rose-950 hover:bg-rose-900 border border-rose-800 text-rose-300 p-2 rounded-lg text-xs transition' title="حذف هذا السجل">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } else {
                document.getElementById('total-badge').innerText = `${visitorsLog.length} زيارة مسجلة`;
                if (visitorsLog.length === 0) {
                    container.innerHTML = `<p class='text-sm text-slate-400 text-center py-8 bg-slate-950/50 rounded-xl border border-slate-800'>لا توجد زيارات مسجلة حتى الآن.</p>`;
                    return;
                }

                let html = "";
                visitorsLog.forEach((vis, idx) => {
                    html += `
                        <div class='bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2'>
                            <div>
                                <p class='font-bold text-sm text-emerald-300'>#${idx + 1} - زائر موقع عام</p>
                                <p class='text-xs text-slate-400 mt-1'>الجهاز/المتصفح: ${esc(vis.device)}</p>
                                <p class='text-[10px] text-slate-500 mt-0.5'>وقت الزيارة: ${esc(vis.time)}</p>
                            </div>
                            <div class='flex items-center space-x-3 space-x-reverse self-end sm:self-center'>
                                <button onclick="deleteSingleRecord(${idx}, 'visitor')" class='bg-rose-950 hover:bg-rose-900 border border-rose-800 text-rose-300 p-2 rounded-lg text-xs transition' title="حذف هذا السجل">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        async function deleteSingleRecord(index, type) {
            if (confirm("هل أنت متأكد من حذف هذا السجل بشكل نهائي؟")) {
                try {
                    await callApi({ action: 'delete', type: type === 'quiz' ? 'quiz' : 'visitor', index: index });
                    await refreshData();
                } catch (e) {
                    alert("تعذّر الحذف، حاول مرة ثانية.");
                }
            }
        }

        async function clearAllRecords() {
            if (confirm("تحذير: هل أنت متأكد من مسح كافة السجلات الحالية نهائياً؟")) {
                try {
                    await callApi({ action: 'clear', type: currentTab === 'quiz' ? 'quiz' : 'visitor' });
                    await refreshData();
                } catch (e) {
                    alert("تعذّر المسح، حاول مرة ثانية.");
                }
            }
        }

        // ===== تقرير Excel الشامل: ملخص + محاور + أسئلة + مشاركين + زيارات =====
        const ANSWER_SCORES = { "دائمًا": 5, "غالبًا": 4, "أحيانًا": 3, "نادرًا": 2, "أبدًا": 1 };
        const ANSWER_ORDER = ["دائمًا", "غالبًا", "أحيانًا", "نادرًا", "أبدًا"];

        const num = v => { const n = parseFloat(String(v).replace(/[^\d.]/g, '')); return isNaN(n) ? null : n; };
        const avg = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 10) / 10 : 0;
        const pct = (part, total) => total ? Math.round(part / total * 1000) / 10 + '%' : '0%';

        function countBy(list, keyFn) {
            const m = {};
            list.forEach(x => { const k = keyFn(x) || 'غير محدد'; m[k] = (m[k] || 0) + 1; });
            return Object.entries(m).sort((a, b) => b[1] - a[1]);
        }

        function makeSheet(rows, widths) {
            const ws = XLSX.utils.aoa_to_sheet(rows);
            ws['!cols'] = widths.map(w => ({ wch: w }));
            return ws;
        }

        function exportToExcel() {
            const results = cachedData.results;
            const visits = cachedData.visits;
            const extraHeaders = cachedData.extraHeaders || [];

            if (!results.length && !visits.length) {
                alert("لا توجد بيانات كافية لتصديرها حالياً.");
                return;
            }

            // أعمدة المحاور والأسئلة (حسب عناوين جدول Google)
            const dimCols = [], qCols = [];
            extraHeaders.forEach((h, i) => {
                if (h.startsWith('محور: ')) dimCols.push({ i, name: h.replace('محور: ', '') });
                else if (/^س\d+: /.test(h)) qCols.push({ i, text: h.replace(/^س\d+: /, ''), n: h.match(/^س(\d+)/)[1] });
            });
            const detailed = results.filter(r => r.extra && r.extra.some(v => v !== ''));

            const scores = results.map(r => num(r.score)).filter(v => v !== null);
            const ratings = results.map(r => num(r.rating)).filter(v => v !== null);
            const fieldOf = r => ((r.profile || '').match(/المجال: ([^-(]+)/) || [])[1]?.trim();
            const majorOf = r => ((r.profile || '').match(/التخصص: (.+)$/) || [])[1]?.trim();
            const today = new Date().toLocaleDateString('ar-SA') + ' - ' + new Date().toLocaleTimeString('ar-SA');

            const wb = XLSX.utils.book_new();
            wb.Workbook = { Views: [{ RTL: true }] }; // اتجاه الملف من اليمين لليسار

            // 1) الملخص العام
            const s = [
                ["تقرير منصة التكيف الجامعي الذكية — الملخص العام"],
                ["تاريخ التقرير", today],
                [],
                ["📊 الإحصائيات العامة", ""],
                ["عدد المشاركين المكتملين", results.length],
                ["عدد الزيارات", visits.length],
                ["نسبة إكمال الاستبيان من الزيارات", pct(results.length, visits.length)],
                ["متوسط نسبة التكيف", avg(scores) + '%'],
                ["أعلى نسبة تكيف", scores.length ? Math.max(...scores) + '%' : '-'],
                ["أدنى نسبة تكيف", scores.length ? Math.min(...scores) + '%' : '-'],
                ["متوسط تقييم المنصة (من 5)", avg(ratings)],
                [],
                ["🏅 توزيع المستويات", "العدد", "النسبة"],
                ...countBy(results, r => r.level).map(([k, c]) => [k, c, pct(c, results.length)]),
                [],
                ["⭐ توزيع تقييم المنصة", "العدد", "النسبة"],
                ...[5, 4, 3, 2, 1].map(n => { const c = ratings.filter(r => r === n).length; return [n + ' نجوم', c, pct(c, ratings.length)]; }),
                [],
                ["👥 توزيع المجالات", "العدد", "النسبة"],
                ...countBy(results, fieldOf).map(([k, c]) => [k, c, pct(c, results.length)])
            ];
            const majors = countBy(results.filter(majorOf), majorOf);
            if (majors.length) {
                s.push([], ["🎓 توزيع التخصصات الجامعية", "العدد", "متوسط التكيف"]);
                majors.forEach(([k, c]) => {
                    const sc = results.filter(r => majorOf(r) === k).map(r => num(r.score)).filter(v => v !== null);
                    s.push([k, c, avg(sc) + '%']);
                });
            }
            XLSX.utils.book_append_sheet(wb, makeSheet(s, [38, 22, 14]), "الملخص العام");

            // 2) تحليل المحاور
            if (dimCols.length && detailed.length) {
                const d = [["المحور", "متوسط النسبة", "أعلى", "أدنى", "عدد (نقطة قوة ≥80%)", "عدد (يحتاج تطوير <60%)"]];
                dimCols.forEach(col => {
                    const vals = detailed.map(r => num(r.extra[col.i])).filter(v => v !== null);
                    d.push([col.name, avg(vals) + '%', vals.length ? Math.max(...vals) + '%' : '-', vals.length ? Math.min(...vals) + '%' : '-',
                        vals.filter(v => v >= 80).length, vals.filter(v => v < 60).length]);
                });
                d.push([], ["* مبني على " + detailed.length + " مشارك لديهم إجابات تفصيلية"]);
                XLSX.utils.book_append_sheet(wb, makeSheet(d, [36, 14, 10, 10, 20, 22]), "تحليل المحاور");
            }

            // 3) تحليل الأسئلة
            if (qCols.length && detailed.length) {
                const q = [["#", "العبارة", "متوسط الدرجة (من 5)", ...ANSWER_ORDER, "نسبة الإجابات الإيجابية (دائمًا + غالبًا)"]];
                qCols.forEach(col => {
                    const ans = detailed.map(r => r.extra[col.i]).filter(Boolean);
                    const counts = ANSWER_ORDER.map(a => ans.filter(x => x === a).length);
                    q.push([col.n, col.text, avg(ans.map(a => ANSWER_SCORES[a] || 0).filter(Boolean)), ...counts, pct(counts[0] + counts[1], ans.length)]);
                });
                XLSX.utils.book_append_sheet(wb, makeSheet(q, [5, 70, 18, 9, 9, 9, 9, 9, 30]), "تحليل الأسئلة");
            }

            // 4) المشاركين بالتفصيل (كل شخص وإجاباته)
            if (results.length) {
                const head = ["م", "الاسم", "المجال والتفاصيل", "نسبة التكيف", "المستوى", "تقييم المنصة", "الوقت",
                    ...dimCols.map(c => c.name), ...qCols.map(c => "س" + c.n + ": " + c.text)];
                const rows = results.map((r, idx) => [idx + 1, r.name, r.profile, r.score, r.level, r.rating, r.date,
                    ...dimCols.map(c => (r.extra || [])[c.i] || ''), ...qCols.map(c => (r.extra || [])[c.i] || '')]);
                XLSX.utils.book_append_sheet(wb, makeSheet([head, ...rows],
                    [5, 20, 40, 11, 28, 14, 24, ...dimCols.map(() => 16), ...qCols.map(() => 22)]), "المشاركين وإجاباتهم");
            }

            // 5) الزيارات
            if (visits.length) {
                const v = [["م", "وقت الزيارة", "الجهاز/المتصفح"], ...visits.map((x, i) => [i + 1, x.time, x.device])];
                XLSX.utils.book_append_sheet(wb, makeSheet(v, [5, 26, 70]), "سجل الزيارات");
            }

            const d = new Date();
            XLSX.writeFile(wb, `تقرير مستشار التكيف ${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}.xlsx`);
        }
    </script>
</body>
</html>
